[project]
name = "real605-cre-sim"
version = "0.1.0"
description = "Chapman REAL 605 commercial real estate analytics simulation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "streamlit>=1.37,<2.0",
  "duckdb>=1.0,<2.0",
  "pandas>=2.2,<3.0",
  "numpy>=2.0,<3.0",
  "scikit-learn>=1.6,<2.0",
  "statsmodels>=0.15,<1.0",
  "plotly>=5.20,<7.0",
  "altair>=5.4,<6.0",
  "pydeck>=0.9,<1.0",
  "shapely>=2.0,<3.0",
  "geopandas>=1.0,<2.0",
  "pyproj>=3.7,<4.0",
  "fredapi>=0.5,<1.0",
  "census>=0.2,<1.0",
  "requests>=2.32,<3.0",
  "pyyaml>=6.0,<7.0",
  "pyarrow>=18.0,<20.0",
  "pytest>=8.0,<10.0",
]

[project.optional-dependencies]
dev = [
  "ruff",
]

[tool.uv]
dev-dependencies = []
